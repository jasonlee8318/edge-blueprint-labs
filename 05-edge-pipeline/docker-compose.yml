name: edge-sensor-classifier-lab

services:
  # ── 5강 App Service: 검증→필터링→집계→이상탐지→전송정책 분류 ──
  # 3회차(03-edgex-setup)가 먼저 떠 있어야 하고,
  # Motor01 디바이스는 6강에서 등록한 것을 그대로 재사용합니다.
  edge-sensor-classifier:
    build: ./app
    container_name: edgex-sensor-classifier
    hostname: edgex-sensor-classifier
    command: ["--registry", "-cp=keeper.http://edgex-core-keeper:59890"]
    environment:
      - EDGEX_SECURITY_SECRET_STORE=false
      - SERVICE_HOST=edgex-sensor-classifier
    ports:
      - "59749:59749"
    networks:
      - edgex-network

networks:
  edgex-network:
    external: true
    name: edgex_edgex-network
