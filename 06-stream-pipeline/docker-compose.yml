name: edge-stream-pipeline-lab

services:
  # ── 6강 App Service: Buffer/Window/Event/Cache 로직을 실제 EdgeX 위에서 실행 ──
  # 3회차(03-edgex-setup)에서 이미 띄운 EdgeX 스택에 연결됩니다.
  # 반드시 03-edgex-setup의 `docker compose up -d`가 먼저 실행되어 있어야 합니다.
  edge-stream-pipeline:
    build: ./app
    container_name: edgex-stream-pipeline
    hostname: edgex-stream-pipeline
    command: ["--registry", "-cp=keeper.http://edgex-core-keeper:59890"]
    environment:
      - EDGEX_SECURITY_SECRET_STORE=false
      - SERVICE_HOST=edgex-stream-pipeline
    ports:
      - "59750:59750"
    networks:
      - edgex-network

networks:
  edgex-network:
    external: true
    name: edgex_edgex-network   # 03-edgex-setup(compose project "edgex")가 만든 네트워크
