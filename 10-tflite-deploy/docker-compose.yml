name: edge-tflite-deploy-lab

services:
  # ── 10강 App Service: 진짜 TFLite 모델로 Motor01을 추론 ──
  # 3회차(03-edgex-setup)가 먼저 떠 있어야 하고,
  # Motor01 디바이스는 6강에서 등록한 것을 그대로 재사용합니다.
  edge-tflite-infer:
    build: ./app
    container_name: edgex-tflite-infer
    hostname: edgex-tflite-infer
    command: ["--registry", "-cp=keeper.http://edgex-core-keeper:59890"]
    environment:
      - EDGEX_SECURITY_SECRET_STORE=false
      - SERVICE_HOST=edgex-tflite-infer
    ports:
      - "59752:59752"
    networks:
      - edgex-network

networks:
  edgex-network:
    external: true
    name: edgex_edgex-network   # 03-edgex-setup이 만든 네트워크
